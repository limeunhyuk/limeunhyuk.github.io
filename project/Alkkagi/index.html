<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초차원 알까기 (Hyperdimensional Alkkagi)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js" defer></script>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen">
        <div class="start-layout">
            <div class="side-panel">
                <h2>조작 방법</h2>
                <img src="assets/textures/tutorial_flick.png" alt="조작 방법">
                <p>자신의 차례인 돌을 드래그해 놓으면<br>반대 방향으로 날아갑니다.</p>
            </div>
            <div class="center-panel">
                <h1>초차원 알까기</h1>
                <div class="input-group">
                    <label>흑 돌 개수:</label>
                    <input type="number" id="input-black" value="10" min="1" max="25">
                </div>
                <div class="input-group">
                    <label>백 돌 개수:</label>
                    <input type="number" id="input-white" value="10" min="1" max="25">
                </div>
                <button id="btn-start">게임 시작</button>
            </div>
            <div class="side-panel">
                <h2>초차원 스킬</h2>
                <img src="assets/textures/tutorial_rhythm.png" alt="스킬 발동">
                <p>돌이 처음 부딪힐 때 생기는 원에 맞춰<br><strong>스페이스바</strong>를 누르세요!</p>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 id="winner-text">흑 승리!</h1>
        <button id="btn-restart">다시하기</button>
        <button id="btn-to-start" style="margin-top: 10px; background: #555;">시작 화면</button>
    </div>

    <div id="ui-container" style="display: none;">
        <h1>초차원 알까기 ☄️</h1>
        <p>드래그하여 돌을 튕기세요!</p>
    </div>
    <div id="skill-selector" style="display: none;">
        <p>이번 턴 스킬 선택</p>
        <div class="skill-options">
            <button class="skill-opt active" data-skill="NONE">기본 공격</button>
            <button class="skill-opt" data-skill="RHYTHM">리듬게임 연출</button>
            <button class="skill-opt" data-skill="TELEPORT">순간이동</button>
            <button class="skill-opt" data-skill="DESTROY">적 돌 소멸</button>
            <button class="skill-opt" data-skill="REPULSE">블랙홀 (밀치기)</button>
        </div>
    </div>
    <div id="rhythm-container" style="display: none;">
        <div class="guide-ring good-outer"></div>
        <div class="guide-ring perfect-outer"></div>
        <div class="guide-ring perfect-inner"></div>
        <div class="guide-ring good-inner"></div>
        <div class="target-ring"></div>
        <div class="shrinking-ring" id="shrinking-ring"></div>
        <div class="rhythm-text" id="rhythm-text">준비...</div>
    </div>
    
    <div id="status-container" style="display: none;">
        <div class="turn-indicator" id="turn-indicator">현재 차례: 흑(Black)</div>
        <div class="score-board">
            <div>흑 돌: <span id="black-score">3 / 3</span></div>
            <div>백 돌: <span id="white-score">3 / 3</span></div>
        </div>
    </div>
</body>
</html>
